spring.application.name=funews-backend
server.port=8080

# ---- Database: SQL Server 2022 ----
# databaseName=FUNews_M1: database cua Module 1 (9 bang). Database FUNews cu chi
# co 3 bang accounts / categories / news_articles, khong con khop entity nua.
#
# Tai khoan va mat khau KHONG nam o day. Chung nam trong application.properties.private
# (file do da bi .gitignore chan, khong bao gio len git). Moi nguoi tu tao mot lan:
#   cd backend
#   cp application.properties.private.example application.properties.private
# roi dien mat khau that cua minh vao.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FUNews_M1;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.config.import=optional:file:./application.properties.private[.properties]
# ---- JPA ----
# Hibernate KHONG tu tao bang. Schema do database/module1_schema.sql quyet dinh.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---- Script khoi tao database ----
# TAT. Schema cua Module 1 do database/module1_schema.sql tao, chay bang tay mot
# lan qua sqlcmd hoac SSMS:
#   sqlcmd -S localhost -E -d FUNews_M1 -i database/module1_schema.sql
#
# De "always" la backend KHONG KHOI DONG DUOC: Spring se chay lai
# schema-sqlserver.sql va data-sqlserver.sql - hai file cua ban cu, con tao bang
# news_articles va INSERT vao cot accounts.name / accounts.role da bi doi ten -
# roi bao loi "Invalid column name" ngay luc khoi dong.
#
# Test tich hop bat lai muc nay trong BackendIntegrationSupport de do data-h2.sql
# vao H2, nen tat o day khong anh huong gi den `mvnw test`.
spring.sql.init.mode=never
spring.sql.init.platform=sqlserver

# ---- Phien dang nhap ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# ---- CORS ----
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.displayRequestDuration=true
