spring.application.name=funews-backend
server.port=8080

# ---- Database: SQL Server 2022 ----
# Tai khoan va mat khau KHONG nam o day. Chung nam trong application.properties.private
# (file do da bi .gitignore chan, khong bao gio len git).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FUNews;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.config.import=optional:file:./application.properties.private[.properties]
spring.datasource.username=sa
spring.datasource.password=sa
# ---- JPA ----
# Hibernate KHONG tu tao bang. Schema do schema-sqlserver.sql quyet dinh.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---- Script khoi tao database ----
# Chay moi lan khoi dong, nhung cac script deu co kiem tra ton tai
# nen khong tao trung va khong xoa du lieu dang co.
spring.sql.init.mode=always
spring.sql.init.platform=sqlserver

# ---- Phien dang nhap ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# ---- CORS ----
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.displayRequestDuration=true
